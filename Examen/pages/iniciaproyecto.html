<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu proyecto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <section>
            <h3>Contáctanos</h3>
            <form class="formulario">
                <fieldset>
                    <legend>Agenda tu cita</legend>
                    <div class="ccontenedor-campos">
                        <div class="campo">
                            <label>Nombre</label>
                            <input 
                            class="input-text"
                            type="text"
                            placeholder="Proporcione su nombre completo">
                        </div>

                         <div class="campo">
                            <label>Correo</label>
                            <input 
                            class="input-text"
                            type="text"
                            placeholder="Su correo electrónico">
                        </div>

                        <div class="campo">
                            <label>Telefono</label>
                            <input 
                            class="input-text"
                            type="tel"
                            placeholder="Su numero de telefono">
                        </div>

                         <div class="campo">
                            <label>Qué te interesa crear</label>
                            <input 
                            class="input-text"
                            type="text"
                            placeholder="Tipo de contenido">
                        </div>

                         <div class="enviar">
                            <input 
                                type="submit"
                                class="boton"
                                value="Enviar">
                            </div>
                        </div>
                    </fieldset>
                    </form>
                    </section>  
</body>
</html>
